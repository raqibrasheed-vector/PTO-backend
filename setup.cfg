[flake8]
max-line-length = 300
extend-ignore = E203, W503, D102, D103
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    .mypy_cache,
    .ruff_cache
per-file-ignores =
    # tests allow assert statements
    tests/*: S101

[tool.ruff]
extend-select = ["D"]   # enable pydocstyle checks
ignore = ["D102", "D103","PLR0917"]  # ignore missing docstring for methods/functions


[mypy]
python_version = 3.9
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

[isort]
profile = black
line_length = 88
known_first_party = cdnzero_api